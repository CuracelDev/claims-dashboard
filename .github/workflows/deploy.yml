name: Deploy to GCP (PM2)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK_HEALTHOPS: ${{ secrets.SLACK_WEBHOOK_HEALTHOPS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_BASE_URL: ${{ secrets.AZURE_OPENAI_BASE_URL }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          METABASE_URL: ${{ secrets.METABASE_URL }}
          METABASE_USERNAME: ${{ secrets.METABASE_USERNAME }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
          PILES_WEEKEND_ROSTER_TOKEN: ${{ secrets.PILES_WEEKEND_ROSTER_TOKEN }}

      - name: Rsync files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ".next,public,package.json,package-lock.json,next.config.js,scripts"
          target: "~/claims-dashboard"

      - name: Restart App via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/claims-dashboard
            cat <<EOF > .env
            DATABASE_URL="${{ secrets.DATABASE_URL }}"
            NEXT_PUBLIC_SUPABASE_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            BOT_CREDENTIALS_ENCRYPTION_KEY="${{ secrets.BOT_CREDENTIALS_ENCRYPTION_KEY }}"
            SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}"
            SLACK_PRISM_BOT_TOKEN="${{ secrets.SLACK_PRISM_BOT_TOKEN }}"
            SLACK_APP_TOKEN="${{ secrets.SLACK_APP_TOKEN }}"
            SLACK_ALERTS_CHANNEL_ID="${{ secrets.SLACK_ALERTS_CHANNEL_ID }}"
            SLACK_WEBHOOK_HEALTHOPS="${{ secrets.SLACK_WEBHOOK_HEALTHOPS }}"
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
            AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}"
            AZURE_OPENAI_BASE_URL="${{ secrets.AZURE_OPENAI_BASE_URL }}"
            AZURE_OPENAI_API_VERSION="${{ secrets.AZURE_OPENAI_API_VERSION }}"
            METABASE_URL="${{ secrets.METABASE_URL }}"
            METABASE_USERNAME="${{ secrets.METABASE_USERNAME }}"
            METABASE_PASSWORD="${{ secrets.METABASE_PASSWORD }}"
            CURACEL_PORTAL_BASE_URL_PRODUCTION="${{ vars.CURACEL_PORTAL_BASE_URL_PRODUCTION }}"
            CURACEL_PORTAL_BASE_URL_TEST="${{ vars.CURACEL_PORTAL_BASE_URL_TEST }}"
            CURACEL_PORTAL_ENVIRONMENT="${{ vars.CURACEL_PORTAL_ENVIRONMENT }}"
            PILES_AUTO_ASSIGNMENT_RUNNER_BACKEND="${{ vars.PILES_AUTO_ASSIGNMENT_RUNNER_BACKEND }}"
            PILES_ASSIGNMENT_PYTHON_BIN="$HOME/claims-dashboard/.venv-piles-auto-assignment/bin/python"
            PLAYWRIGHT_BROWSERS_PATH="$HOME/claims-dashboard/.playwright-browsers"
            ALLOW_PRODUCTION_ASSIGNMENTS="${{ vars.ALLOW_PRODUCTION_ASSIGNMENTS }}"
            HEADLESS="${{ vars.HEADLESS }}"
            PYTHONUNBUFFERED="${{ vars.PYTHONUNBUFFERED }}"
            SCREENSHOT_ON_ERROR="${{ vars.SCREENSHOT_ON_ERROR }}"
            PILES_AUTO_ASSIGNMENT_CRON_SCHEDULE="${{ vars.PILES_AUTO_ASSIGNMENT_CRON_SCHEDULE }}"
            PILES_WEEKEND_ROSTER_TOKEN="${{ secrets.PILES_WEEKEND_ROSTER_TOKEN }}"
            EOF
            export PATH="$HOME/.local/bin:$PATH"
            export PLAYWRIGHT_BROWSERS_PATH="$HOME/claims-dashboard/.playwright-browsers"
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip python3-venv
            npm install --production
            python3 -m venv .venv-piles-auto-assignment
            ./.venv-piles-auto-assignment/bin/python -m pip install --upgrade pip
            ./.venv-piles-auto-assignment/bin/python -m pip install -r scripts/piles-auto-assignment-requirements.txt
            ./.venv-piles-auto-assignment/bin/python -m playwright install --with-deps chromium chromium-headless-shell
            npm run db:piles-auto-assignment
            chmod +x scripts/run-piles-auto-assignment.sh scripts/install-piles-auto-assignment-cron.sh
            ./scripts/install-piles-auto-assignment-cron.sh
            pm2 restart claims-dashboard || pm2 start npm --name "claims-dashboard" -- start -- -p 3030
