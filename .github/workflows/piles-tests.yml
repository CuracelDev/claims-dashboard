name: Piles Regression Tests

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: piles-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: piles_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: piles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U piles_test -d piles_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      # Isolated fixtures: disposable CI database only; no production access.
      - run: npm run test:piles
        env:
          PILES_TEST_DATABASE_URL: postgresql://piles_test:isolated-ci-only@127.0.0.1:5432/piles_test
      # Real browser, synthetic localhost endpoint; no production credentials.
      - run: python -m pip install -r scripts/piles-auto-assignment-requirements.txt
      - run: python -m playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/piles-test-browsers
      - run: python scripts/test-piles-browser-response.py -v
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/piles-test-browsers
