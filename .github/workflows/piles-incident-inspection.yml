name: Piles Incident Inspection

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only inspection to run
        required: true
        default: provenance
        type: choice
        options:
          - provenance
          - incident
      hours:
        description: Inspection window in hours (provenance supports up to 720)
        required: true
        default: 24
        type: number
      insurer:
        description: Optional insurer filter for provenance inspection
        required: false
        type: string
      run_id:
        description: Optional parent runner UUID
        required: false
        type: string

concurrency:
  group: piles-production-host
  cancel-in-progress: false

jobs:
  inspection:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect sanitized Piles incident evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          INSPECTION_OPERATION: ${{ inputs.operation }}
          INCIDENT_HOURS: ${{ inputs.hours }}
          INCIDENT_RUN_ID: ${{ inputs.run_id }}
          PROVENANCE_INSURER: ${{ inputs.insurer }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: INSPECTION_OPERATION,INCIDENT_HOURS,INCIDENT_RUN_ID,PROVENANCE_INSURER
          script: |
            set -eu
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a

            if [ "$INSPECTION_OPERATION" = "provenance" ]; then
              if [ -n "$PROVENANCE_INSURER" ]; then
                node scripts/audit-piles-assignment-provenance.mjs \
                  --hours "$INCIDENT_HOURS" \
                  --insurer "$PROVENANCE_INSURER"
              else
                node scripts/audit-piles-assignment-provenance.mjs \
                  --hours "$INCIDENT_HOURS"
              fi
            elif [ -n "$INCIDENT_RUN_ID" ]; then
              node scripts/inspect-piles-runner-incidents.mjs \
                --hours "$INCIDENT_HOURS" \
                --run-id "$INCIDENT_RUN_ID"
            else
              node scripts/inspect-piles-runner-incidents.mjs \
                --hours "$INCIDENT_HOURS"
            fi
