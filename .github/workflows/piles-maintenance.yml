name: Piles Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Diagnostic or explicitly confirmed maintenance operation
        type: choice
        required: true
        default: incident
        options:
          - incident
          - provenance
          - historical-review
          - readiness
          - runtime-probe
          - runtime-repair
          - stale-inspect
          - stale-recover
          - legacy-audit
          - legacy-apply
      insurer:
        description: Required for historical-review and one-insurer readiness
        type: string
        required: false
      hours:
        description: Inspection lookback (1-720 hours)
        type: number
        default: 24
      scope:
        description: Readiness scope
        type: choice
        default: one-insurer
        options: [one-insurer, all-active]
      target_kind:
        description: Exact target type; none for untargeted diagnostics
        type: choice
        default: none
        options: [none, parent, insurer-run, work, legacy-request]
      target_id:
        description: Exact ID matching target kind
        type: string
        required: false
      claim_token:
        description: Work recovery only; input metadata is not a secret store
        type: string
        required: false
      confirmation:
        description: Repair REPAIR PILES RUNTIME; recover RECOVER_STALE_RUNS; legacy CANCEL_OBSOLETE_LEGACY_REQUESTS
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: piles-production-host
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
  inspection:
    needs: validate
    if: ${{ contains(fromJSON('["incident","provenance","historical-review"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
      - name: Prepare read-only historical ownership reviewer
        if: inputs.operation == 'historical-review'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const source = readFileSync('scripts/review_piles_historical_assignments.py');
          appendFileSync(process.env.GITHUB_ENV, `HISTORICAL_SCRIPT_B64=${source.toString('base64')}\n`);
          JS
          echo "Reviewer revision: $GITHUB_SHA"
      - name: Prepare versioned read-only inspector
        if: inputs.operation == 'incident'
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const source = readFileSync('scripts/inspect-piles-runner-incidents.mjs', 'utf8')
            + '\nawait main().catch(() => { console.error("Incident inspection failed safely."); process.exitCode = 1; });\n';
          appendFileSync(process.env.GITHUB_ENV, `INCIDENT_SCRIPT_B64=${Buffer.from(source).toString('base64')}\n`);
          JS
          echo "Inspector revision: $GITHUB_SHA"
      - name: Inspect sanitized Piles incident evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          INSPECTION_OPERATION: ${{ env.INSPECTION_OPERATION }}
          INCIDENT_HOURS: ${{ env.INCIDENT_HOURS }}
          INCIDENT_RUN_ID: ${{ env.INCIDENT_RUN_ID }}
          PROVENANCE_INSURER: ${{ env.PROVENANCE_INSURER }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: INSPECTION_OPERATION,INCIDENT_HOURS,INCIDENT_RUN_ID,PROVENANCE_INSURER,INCIDENT_SCRIPT_B64,HISTORICAL_SCRIPT_B64
          script: |
            set -eu
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a

            if [ "$INSPECTION_OPERATION" = "historical-review" ]; then
              test -n "$PROVENANCE_INSURER"
              # Deployments are rsync artifacts and need not contain .git.
              "$PILES_ASSIGNMENT_PYTHON_BIN" -c 'import hashlib,pathlib; files=["scripts/piles_auto_assignment_runner.py", "scripts/piles_auto_assignment/store.py", "scripts/piles_auto_assignment/evidence.py", "scripts/piles_auto_assignment/scanning.py"]; [print("Deployed dependency sha256:", name, hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()) for name in files]'
              printf '%s' "$HISTORICAL_SCRIPT_B64" | base64 --decode | "$PILES_ASSIGNMENT_PYTHON_BIN" - \
                --insurer "$PROVENANCE_INSURER" --hours "$INCIDENT_HOURS"
            elif [ "$INSPECTION_OPERATION" = "provenance" ]; then
              if [ -n "$PROVENANCE_INSURER" ]; then
                node scripts/audit-piles-assignment-provenance.mjs \
                  --hours "$INCIDENT_HOURS" \
                  --insurer "$PROVENANCE_INSURER"
              else
                node scripts/audit-piles-assignment-provenance.mjs \
                  --hours "$INCIDENT_HOURS"
              fi
            elif [ -n "$INCIDENT_RUN_ID" ]; then
              printf '%s' "$INCIDENT_SCRIPT_B64" | base64 --decode | node --input-type=module - \
                --hours "$INCIDENT_HOURS" \
                --run-id "$INCIDENT_RUN_ID"
            else
              printf '%s' "$INCIDENT_SCRIPT_B64" | base64 --decode | node --input-type=module - \
                --hours "$INCIDENT_HOURS"
            fi

  readiness:
    needs: validate
    if: ${{ contains(fromJSON('["readiness"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
      - name: Audit production database and portal without assignments
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          PROBE_SCOPE: ${{ env.PROBE_SCOPE }}
          PROBE_INSURER: ${{ env.PROBE_INSURER }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 110m
          envs: PROBE_SCOPE,PROBE_INSURER
          script: |
            set -eu
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a

            case "$PILES_ASSIGNMENT_PROVENANCE_V2" in
              disabled|shadow|enabled) ;;
              *) echo "PILES_ASSIGNMENT_PROVENANCE_V2 is not explicitly configured." >&2; exit 1 ;;
            esac

            "${PILES_RUNTIME_CONTROL_PYTHON:-python3}" "${PILES_RUNTIME_HEALTH_SCRIPT:-scripts/piles_runtime_health.py}" \
              --runtime-root "${PILES_RUNTIME_ROOT:-.piles-runtime}" \
              --requirements scripts/piles-auto-assignment-requirements.txt \
              --python-bin "$PILES_ASSIGNMENT_PYTHON_BIN" \
              --mode full \
              --json

            node scripts/db-schema-audit.mjs
            readiness_status=0
            node scripts/audit-piles-auto-assignment-readiness.mjs --mode database || readiness_status=$?
            provenance_status=0
            node scripts/audit-piles-assignment-provenance.mjs --hours 720 || provenance_status=$?

            probe_status=0
            if [ "$PROBE_SCOPE" = "all-active" ]; then
              "$PILES_ASSIGNMENT_PYTHON_BIN" scripts/piles_auto_assignment_runner.py \
                --all-active \
                --portal-environment production \
                --month All \
                --year All \
                --run-source readiness \
                --read-only || probe_status=$?
            else
              if [ -z "$PROBE_INSURER" ]; then
                echo "insurer is required for a one-insurer probe" >&2
                exit 1
              fi
              "$PILES_ASSIGNMENT_PYTHON_BIN" scripts/piles_auto_assignment_runner.py \
                --insurer "$PROBE_INSURER" \
                --portal-environment production \
                --month All \
                --year All \
                --run-source readiness \
                --read-only || probe_status=$?
            fi

            if [ "$probe_status" -ne 0 ]; then
              echo "Portal readiness probe failed with status $probe_status." >&2
              exit "$probe_status"
            fi
            echo "Portal readiness probe completed successfully."
            if [ "$readiness_status" -ne 0 ]; then
              echo "Runtime readiness audit failed with status $readiness_status." >&2
              exit "$readiness_status"
            fi
            if [ "$provenance_status" -ne 0 ]; then
              echo "Provenance readiness audit failed with status $provenance_status." >&2
              exit "$provenance_status"
            fi
            echo "Provenance readiness audit completed successfully."
            echo "Runtime readiness audit completed successfully."

  probe:
    needs: validate
    if: ${{ contains(fromJSON('["runtime-probe"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
      - name: Inspect bounded production runtime evidence
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a

            echo "Bot eligibility counts at current Lagos time"
            node --input-type=module <<'NODE'
            import pg from 'pg';
            const sslDisabled = process.env.DATABASE_SSL === 'false'
              || new URL(process.env.DATABASE_URL).searchParams.get('sslmode') === 'disable';
            const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL, max: 1,
              ssl: sslDisabled ? undefined : { rejectUnauthorized: process.env.DATABASE_SSL_REJECT_UNAUTHORIZED === 'true' } });
            const client = await pool.connect();
            try {
              await client.query('BEGIN READ ONLY');
              const eligibility = await client.query(`WITH bot AS (
              SELECT insurer_name, is_active, is_available, availability_status,
                CASE WHEN btrim(coalesce(active_from_time, '')) ~ '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  THEN active_from_time::time ELSE NULL END AS starts,
                CASE WHEN btrim(coalesce(active_to_time, '')) ~ '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  THEN active_to_time::time ELSE NULL END AS ends,
                (clock_timestamp() AT TIME ZONE 'Africa/Lagos')::time AS local_time
              FROM piles_auto_assignment_bot_accounts)
            SELECT insurer_name,
              count(*) AS configured,
              count(*) FILTER (WHERE is_active) AS active,
              count(*) FILTER (WHERE is_active AND is_available
                AND coalesce(availability_status, '') IN ('', 'available', 'weekend_added')) AS available,
              count(*) FILTER (WHERE is_active AND is_available
                AND coalesce(availability_status, '') IN ('', 'available', 'weekend_added')
                AND CASE
                  WHEN starts IS NULL AND ends IS NULL THEN true
                  WHEN coalesce(starts, time '00:00') <= coalesce(ends, time '23:59:59')
                    THEN local_time BETWEEN coalesce(starts, time '00:00') AND coalesce(ends, time '23:59:59')
                  ELSE local_time >= coalesce(starts, time '00:00') OR local_time <= coalesce(ends, time '23:59:59')
                END) AS eligible_now
            FROM bot GROUP BY insurer_name ORDER BY insurer_name`);
              for (const row of eligibility.rows) {
                console.log([row.insurer_name, row.configured, row.active, row.available, row.eligible_now].join('|'));
              }
              const roster = await client.query(`SELECT
                (SELECT count(*) FROM piles_auto_assignment_weekend_rosters
            WHERE weekend_start <= (clock_timestamp() AT TIME ZONE 'Africa/Lagos')::date
              AND weekend_end >= (clock_timestamp() AT TIME ZONE 'Africa/Lagos')::date) AS current_rosters,
                (SELECT count(*) FROM piles_auto_assignment_weekend_roster_members member
                 JOIN piles_auto_assignment_weekend_rosters roster ON roster.id = member.roster_id
                 WHERE roster.weekend_start <= (clock_timestamp() AT TIME ZONE 'Africa/Lagos')::date
                   AND roster.weekend_end >= (clock_timestamp() AT TIME ZONE 'Africa/Lagos')::date
                   AND lower(btrim(member.duty_status)) = 'on_shift') AS current_on_shift_members`);
              console.log(`current_rosters|${roster.rows[0].current_rosters}`);
              console.log(`current_on_shift_members|${roster.rows[0].current_on_shift_members}`);
            } finally {
              await client.query('ROLLBACK');
              client.release();
              await pool.end();
            }
            NODE

            echo "Host termination evidence counts"
            kernel_log="$(journalctl -k --since '12 hours ago' --no-pager 2>/dev/null || true)"
            printf 'oom_events|%s\n' "$(printf '%s\n' "$kernel_log" | awk 'tolower($0) ~ /out of memory|oom-kill|killed process/ {n++} END {print n+0}')"
            printf 'runner_processes|%s\n' "$(ps -eo comm=,args= | awk '$1 ~ /^python([0-9.]*)?$/ && /piles_auto_assignment_runner[.]py/ {n++} END {print n+0}')"

            echo "Sanitized scheduler runtime evidence"
            cron_service_active=0
            cron_service_enabled=0
            if command -v systemctl >/dev/null 2>&1; then
              if systemctl is-active --quiet cron 2>/dev/null || systemctl is-active --quiet crond 2>/dev/null; then
                cron_service_active=1
              fi
              if systemctl is-enabled --quiet cron 2>/dev/null || systemctl is-enabled --quiet crond 2>/dev/null; then
                cron_service_enabled=1
              fi
            fi
            printf 'cron_service_active|%s\n' "$cron_service_active"
            printf 'cron_service_enabled|%s\n' "$cron_service_enabled"
            printf 'cron_daemon_processes|%s\n' "$(ps -eo comm= | awk '$1 == "cron" || $1 == "crond" {n++} END {print n+0}')"

            cron_lines="$(crontab -l 2>/dev/null || true)"
            printf 'managed_cron_entries|%s\n' "$(printf '%s\n' "$cron_lines" | awk '/# piles-auto-assignment$/ {n++} END {print n+0}')"
            printf 'hourly_managed_cron_entries|%s\n' "$(printf '%s\n' "$cron_lines" | awk '$1 == "0" && $2 == "*" && $3 == "*" && $4 == "*" && $5 == "*" && /# piles-auto-assignment$/ {n++} END {print n+0}')"
            if [ "${PILES_AUTO_ASSIGNMENT_CRON_SCHEDULE:-}" = "0 * * * *" ]; then
              printf 'schedule_configured|1\n'
            else
              printf 'schedule_configured|0\n'
            fi
            if [ -x ./scripts/run-piles-auto-assignment.sh ]; then
              printf 'runner_wrapper_executable|1\n'
            else
              printf 'runner_wrapper_executable|0\n'
            fi
            runtime_root="${PILES_RUNTIME_ROOT:-$PWD/.piles-runtime}"
            expected_python="$runtime_root/current/bin/python"
            if [ -n "${PILES_ASSIGNMENT_PYTHON_BIN:-}" ] && [ -x "$PILES_ASSIGNMENT_PYTHON_BIN" ]; then
              printf 'python_runtime_executable|1\n'
              if [ "$PILES_ASSIGNMENT_PYTHON_BIN" = "$expected_python" ]; then
                printf 'runtime_expected_path_configured|1\n'
              else
                printf 'runtime_expected_path_configured|0\n'
              fi
              runtime_manifest="$runtime_root/current/piles-runtime-manifest.json"
              if [ -f "$runtime_manifest" ]; then
                printf 'runtime_manifest_exists|1\n'
                manifest_mtime="$(stat -c %Y "$runtime_manifest" 2>/dev/null || stat -f %m "$runtime_manifest" 2>/dev/null || printf '0')"
                case "$manifest_mtime" in (*[!0-9]*|'') manifest_mtime=0 ;; esac
                manifest_now="$(date +%s)"
                if [ "$manifest_mtime" -gt 0 ] && [ "$manifest_now" -ge "$manifest_mtime" ]; then
                  printf 'runtime_manifest_age_seconds|%s\n' "$((manifest_now - manifest_mtime))"
                else
                  printf 'runtime_manifest_age_seconds|-1\n'
                fi
              else
                printf 'runtime_manifest_exists|0\n'
                printf 'runtime_manifest_age_seconds|-1\n'
              fi
              runtime_health_status=0
              "${PILES_RUNTIME_CONTROL_PYTHON:-python3}" scripts/piles_runtime_health.py \
                --runtime-root "$runtime_root" \
                --requirements scripts/piles-auto-assignment-requirements.txt \
                --python-bin "$PILES_ASSIGNMENT_PYTHON_BIN" \
                --mode light --json >/dev/null 2>&1 || runtime_health_status=$?
              if [ "$runtime_health_status" -eq 0 ]; then
                printf 'runtime_health_check_passed|1\n'
              else
                printf 'runtime_health_check_passed|0\n'
              fi
              if [ -f "$runtime_root/current/pyvenv.cfg" ]; then
                printf 'runtime_pyvenv_config_exists|1\n'
              else
                printf 'runtime_pyvenv_config_exists|0\n'
              fi
              PYTHONPATH="$PWD/scripts" "$PILES_ASSIGNMENT_PYTHON_BIN" - <<'PY'
            import importlib.util
            import importlib.metadata
            import os
            import site
            import sys

            modules = {
                "python_module_psycopg2": "psycopg2",
                "python_module_requests": "requests",
                "python_module_dotenv": "dotenv",
                "python_module_playwright": "playwright.sync_api",
                "python_module_piles_auto_assignment": "piles_auto_assignment",
            }
            for label, module in modules.items():
                try:
                    available = int(importlib.util.find_spec(module) is not None)
                except (ImportError, ModuleNotFoundError, ValueError):
                    available = 0
                print(f"{label}|{available}")
            print(f"python_is_virtualenv|{int(sys.prefix != sys.base_prefix)}")
            print(f"python_pip_available|{int(importlib.util.find_spec('pip') is not None)}")
            site_directories = [path for path in site.getsitepackages() if os.path.isdir(path)]
            print(f"runtime_site_packages_dirs|{len(site_directories)}")
            print(f"runtime_installed_distributions|{sum(1 for _ in importlib.metadata.distributions())}")
            print(f"runtime_site_packages_mtime_epoch|{int(max((os.stat(path).st_mtime for path in site_directories), default=0))}")
            print(f"runtime_bin_mtime_epoch|{int(os.stat(os.path.dirname(sys.executable)).st_mtime)}")
            PY
            else
              printf 'python_runtime_executable|0\n'
              printf 'runtime_expected_path_configured|0\n'
              printf 'runtime_manifest_exists|0\n'
              printf 'runtime_manifest_age_seconds|-1\n'
              printf 'runtime_health_check_passed|0\n'
              printf 'runtime_pyvenv_config_exists|0\n'
              printf 'python_module_psycopg2|0\n'
              printf 'python_module_requests|0\n'
              printf 'python_module_dotenv|0\n'
              printf 'python_module_playwright|0\n'
              printf 'python_module_piles_auto_assignment|0\n'
              printf 'python_is_virtualenv|0\n'
              printf 'python_pip_available|0\n'
              printf 'runtime_site_packages_dirs|0\n'
              printf 'runtime_installed_distributions|0\n'
              printf 'runtime_site_packages_mtime_epoch|0\n'
              printf 'runtime_bin_mtime_epoch|0\n'
            fi

            cron_log="${PILES_AUTO_ASSIGNMENT_CRON_LOG:-${PILES_AUTO_ASSIGNMENT_CRON_LOG_DIR:-$PWD/tmp}/piles-auto-assignment-cron.log}"
            if [ -f "$cron_log" ]; then
              printf 'cron_log_exists|1\n'
              log_mtime="$(stat -c %Y "$cron_log" 2>/dev/null || stat -f %m "$cron_log" 2>/dev/null || printf '0')"
              log_size="$(stat -c %s "$cron_log" 2>/dev/null || stat -f %z "$cron_log" 2>/dev/null || printf '0')"
              now_epoch="$(date +%s)"
              case "$log_mtime" in (*[!0-9]*|'') log_mtime=0 ;; esac
              if [ "$log_mtime" -gt 0 ] && [ "$now_epoch" -ge "$log_mtime" ]; then
                log_age=$((now_epoch - log_mtime))
              else
                log_age=-1
              fi
              printf 'cron_log_age_seconds|%s\n' "$log_age"
              printf 'cron_log_size_bytes|%s\n' "$log_size"
              cutoff="$(date -d '72 hours ago' '+%Y-%m-%d %H:%M:%S' 2>/dev/null || printf '0000-00-00 00:00:00')"
              recent_log_count() {
                awk -v cutoff="$cutoff" -v pattern="$1" '
                  /Starting Piles Auto-Assignment schedule/ { recent = (substr($0,2,19) >= cutoff) }
                  recent && $0 ~ pattern { n++ }
                  END { print n+0 }
                ' "$cron_log"
              }
              printf 'cron_start_markers_72h|%s\n' "$(awk -v cutoff="$cutoff" 'substr($0,2,19) >= cutoff && /Starting Piles Auto-Assignment schedule/ {n++} END {print n+0}' "$cron_log")"
              printf 'cron_tracebacks_72h|%s\n' "$(recent_log_count 'Traceback \\(most recent call last\\)')"
              printf 'cron_runner_failures_72h|%s\n' "$(recent_log_count '^RUN FAILED:')"
              printf 'cron_runtime_errors_72h|%s\n' "$(recent_log_count '(^|[.])RuntimeError:')"
              printf 'cron_operational_errors_72h|%s\n' "$(recent_log_count '(^|[.])OperationalError:')"
              printf 'cron_import_errors_72h|%s\n' "$(recent_log_count '(^|[.])(ModuleNotFoundError|ImportError):')"
              printf 'cron_file_not_found_errors_72h|%s\n' "$(recent_log_count '(^|[.])FileNotFoundError:')"
              printf 'cron_playwright_errors_72h|%s\n' "$(recent_log_count '(Playwright|playwright|BrowserType|TargetClosedError|chromium)')"
              printf 'cron_configuration_errors_72h|%s\n' "$(recent_log_count '(required|must be|not explicitly configured|not enabled|Invalid configuration)')"
              printf 'cron_tracebacks_total|%s\n' "$(awk '/Traceback \(most recent call last\)/ {n++} END {print n+0}' "$cron_log")"
              printf 'cron_command_not_found_total|%s\n' "$(awk 'tolower($0) ~ /command not found|no such file or directory|can.t open/ {n++} END {print n+0}' "$cron_log")"
              printf 'cron_permission_errors_total|%s\n' "$(awk 'tolower($0) ~ /permission denied/ {n++} END {print n+0}' "$cron_log")"
            else
              printf 'cron_log_exists|0\n'
              printf 'cron_log_age_seconds|-1\n'
              printf 'cron_log_size_bytes|0\n'
              printf 'cron_start_markers_72h|0\n'
              printf 'cron_tracebacks_72h|0\n'
              printf 'cron_runner_failures_72h|0\n'
              printf 'cron_runtime_errors_72h|0\n'
              printf 'cron_operational_errors_72h|0\n'
              printf 'cron_import_errors_72h|0\n'
              printf 'cron_file_not_found_errors_72h|0\n'
              printf 'cron_playwright_errors_72h|0\n'
              printf 'cron_configuration_errors_72h|0\n'
              printf 'cron_tracebacks_total|0\n'
              printf 'cron_command_not_found_total|0\n'
              printf 'cron_permission_errors_total|0\n'
            fi

            printf 'cron_journal_invocations_72h|%s\n' "$(journalctl -u cron -u crond --since '72 hours ago' --no-pager 2>/dev/null | awk '/run-piles-auto-assignment[.]sh/ {n++} END {print n+0}')"
            printf 'host_boot_epoch|%s\n' "$(awk '$1 == "btime" {print $2}' /proc/stat 2>/dev/null | head -n 1)"
            printf 'root_filesystem_use_percent|%s\n' "$(df -P / | awk 'NR == 2 {gsub(/%/, "", $5); print $5}')"

  repair:
    needs: validate
    if: ${{ contains(fromJSON('["runtime-repair"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
      - name: Atomically repair and verify the production runtime
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          REPAIR_CONFIRMATION: ${{ env.REPAIR_CONFIRMATION }}
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 55m
          envs: REPAIR_CONFIRMATION
          script: |
            set -eu
            if [ "$REPAIR_CONFIRMATION" != "REPAIR PILES RUNTIME" ]; then
              echo "Exact runtime-repair confirmation was not supplied." >&2
              exit 2
            fi
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a
            if pgrep -f '[p]iles_auto_assignment_runner[.]py' >/dev/null 2>&1; then
              echo "A Piles assignment runner is active; runtime repair was not started." >&2
              exit 3
            fi
            PILES_RUNTIME_INSTALL_OS_DEPS=true sh scripts/prepare-piles-production-runtime.sh
            "${PILES_RUNTIME_CONTROL_PYTHON:-python3}" "${PILES_RUNTIME_HEALTH_SCRIPT:-scripts/piles_runtime_health.py}" \
              --runtime-root "${PILES_RUNTIME_ROOT:-.piles-runtime}" \
              --requirements scripts/piles-auto-assignment-requirements.txt \
              --python-bin "$PILES_ASSIGNMENT_PYTHON_BIN" \
              --mode full \
              --json
            echo "Piles runtime repair and full verification completed without running assignments."

  recover:
    needs: validate
    if: ${{ contains(fromJSON('["stale-inspect","stale-recover","legacy-audit","legacy-apply"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate inputs privately
        run: node scripts/validate-piles-maintenance-inputs.mjs
      - name: Inspect or recover stale Piles runs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: RECOVERY_ACTION,RECOVERY_CONFIRMATION,RECOVERY_WORK_ID,RECOVERY_CLAIM_TOKEN,RECOVERY_INSURER_RUN_ID,RECOVERY_PARENT_RUN_ID,RECOVERY_REQUEST_ID
          script: |
            set -eu
            # Never enable shell tracing: IDs/tokens and .env must not be echoed.
            fail() { echo "Invalid recovery action, target or confirmation." >&2; exit 1; }
            set --
            case "$RECOVERY_ACTION" in
              inspect|recover)
                [ -z "$RECOVERY_REQUEST_ID" ] || fail
                target_count=0
                if [ -n "$RECOVERY_WORK_ID" ]; then
                  set -- "$@" --work-id "$RECOVERY_WORK_ID"
                  target_count=$((target_count + 1))
                fi
                if [ -n "$RECOVERY_INSURER_RUN_ID" ]; then
                  set -- "$@" --insurer-run-id "$RECOVERY_INSURER_RUN_ID"
                  target_count=$((target_count + 1))
                fi
                if [ -n "$RECOVERY_PARENT_RUN_ID" ]; then
                  set -- "$@" --parent-run-id "$RECOVERY_PARENT_RUN_ID"
                  target_count=$((target_count + 1))
                fi
                [ "$target_count" -le 1 ] || fail
                if [ "$RECOVERY_ACTION" = recover ]; then
                  [ "$target_count" -eq 1 ] && [ "$RECOVERY_CONFIRMATION" = RECOVER_STALE_RUNS ] || fail
                  set -- "$@" --apply --confirmation "$RECOVERY_CONFIRMATION"
                  if [ -n "$RECOVERY_WORK_ID" ]; then
                    [ -n "$RECOVERY_CLAIM_TOKEN" ] || fail
                    set -- "$@" --claim-token "$RECOVERY_CLAIM_TOKEN"
                  else
                    [ -z "$RECOVERY_CLAIM_TOKEN" ] || fail
                  fi
                else
                  [ -z "$RECOVERY_CONFIRMATION" ] && [ -z "$RECOVERY_CLAIM_TOKEN" ] || fail
                fi
                operation_script=scripts/recover-piles-stale-runs.mjs
                ;;
              legacy-audit|legacy-apply)
                [ -z "$RECOVERY_WORK_ID" ] && [ -z "$RECOVERY_CLAIM_TOKEN" ] && [ -z "$RECOVERY_INSURER_RUN_ID" ] && [ -z "$RECOVERY_PARENT_RUN_ID" ] || fail
                if [ -n "$RECOVERY_REQUEST_ID" ]; then set -- --request-id "$RECOVERY_REQUEST_ID"; fi
                if [ "$RECOVERY_ACTION" = legacy-apply ]; then
                  [ -n "$RECOVERY_REQUEST_ID" ] && [ "$RECOVERY_CONFIRMATION" = CANCEL_OBSOLETE_LEGACY_REQUESTS ] || fail
                  set -- "$@" --apply --confirmation "$RECOVERY_CONFIRMATION"
                else
                  [ -z "$RECOVERY_CONFIRMATION" ] || fail
                fi
                operation_script=scripts/audit-piles-legacy-requests.mjs
                ;;
              *) fail ;;
            esac
            cd ~/claims-dashboard
            set -a
            . ./.env
            set +a
            node "$operation_script" "$@"
